[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION    = "20"
  SITE_LAUNCHED   = "true"

# ── Global headers (all contexts) ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# consent-init.js must not be immutably cached — if consent defaults change
# browsers must pick up the new version immediately.
[[headers]]
  for = "/consent-init.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# __forms.html is a static Netlify Forms detection stub (see public/__forms.html
# and its <meta name="robots"> tag) — never meant to be crawled or indexed.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Deploy-preview: always noindex ────────────────────────────────────────────
# X-Robots-Tag is injected into out/_headers by scripts/postbuild.mjs
# when Netlify's $CONTEXT env var is "deploy-preview" or "branch-deploy".
