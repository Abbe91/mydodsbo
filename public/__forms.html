<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Formulärdetektering</title>
</head>
<body>
<!--
  Static form-detection stub for Netlify Forms.

  components/forms/ContactForm.tsx renders the same fields via Next.js, but
  Netlify's build-time HTML scan wasn't picking it up there. This plain,
  unstyled duplicate exists only so the scanner has a form to find — it is
  never linked from the site nav and is excluded via robots.txt/netlify.toml.

  Keep every name="" attribute below in sync with ContactForm.tsx:
  form name, hidden form-name value, honeypot field, and all input names —
  including every checkbox in the "tjanster" group.
-->
<form name="kontakt" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="kontakt">
  <p>
    <label>Fyll inte i detta fält: <input name="bot-field"></label>
  </p>
  <p>
    <label>Namn <input type="text" name="namn"></label>
  </p>
  <p>
    <label>Telefon <input type="tel" name="telefon"></label>
  </p>
  <p>
    <label>E-post <input type="email" name="epost"></label>
  </p>
  <p>
    <label>Adress <input type="text" name="adress"></label>
  </p>
  <p>
    <label>Postnummer <input type="text" name="postnummer"></label>
  </p>
  <p>
    <label>Stad / Stadsdel <input type="text" name="stad"></label>
  </p>
  <p>
    <label>Bostadstyp
      <select name="bostadstyp">
        <option value="">Välj bostadstyp</option>
        <option value="Lägenhet">Lägenhet</option>
        <option value="Villa">Villa</option>
        <option value="Radhus">Radhus</option>
        <option value="Bostadsrätt">Bostadsrätt</option>
        <option value="Annat">Annat</option>
      </select>
    </label>
  </p>
  <p>
    <label>Antal rum
      <select name="antal_rum">
        <option value="">Välj antal rum</option>
        <option value="1 rum">1 rum</option>
        <option value="2 rum">2 rum</option>
        <option value="3 rum">3 rum</option>
        <option value="4 rum">4 rum</option>
        <option value="5+ rum">5+ rum</option>
        <option value="Vet ej">Vet ej</option>
      </select>
    </label>
  </p>
  <p>
    <label>Hiss
      <select name="hiss">
        <option value="">Välj</option>
        <option value="Ja">Ja</option>
        <option value="Nej">Nej</option>
        <option value="Vet ej">Vet ej</option>
      </select>
    </label>
  </p>
  <p>
    <label>Våningsplan <input type="text" name="vaning"></label>
  </p>
  <p>Vad behöver du hjälp med?</p>
  <p><label><input type="checkbox" name="tjanster" value="Dödsbotömning"> Dödsbotömning</label></p>
  <p><label><input type="checkbox" name="tjanster" value="Dödsbostädning"> Dödsbostädning</label></p>
  <p><label><input type="checkbox" name="tjanster" value="Värdering & uppköp"> Värdering & uppköp</label></p>
  <p><label><input type="checkbox" name="tjanster" value="Bortforsling"> Bortforsling</label></p>
  <p><label><input type="checkbox" name="tjanster" value="Flytt eller magasinering"> Flytt eller magasinering</label></p>
  <p><label><input type="checkbox" name="tjanster" value="Hela processen"> Hela processen</label></p>
  <p>
    <label>Önskat datum <input type="date" name="onskat_datum"></label>
  </p>
  <p>
    <label>Meddelande <textarea name="meddelande"></textarea></label>
  </p>
  <p>
    <button type="submit">Skicka</button>
  </p>
</form>
</body>
</html>
